log_format msef_privacy '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name morningstar-ef.org www.morningstar-ef.org;
    return 301 https://morningstar-ef.org$request_uri;
    access_log /var/log/nginx/morningstar-ef.access.log msef_privacy;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.morningstar-ef.org;
    access_log /var/log/nginx/morningstar-ef.access.log msef_privacy;
    ssl_certificate /etc/letsencrypt/live/morningstar-ef.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/morningstar-ef.org/privkey.pem;
    return 301 https://morningstar-ef.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name morningstar-ef.org;
    access_log /var/log/nginx/morningstar-ef.access.log msef_privacy;
    root /var/www/morningstar-ef.org/frontend/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 150k;

    ssl_certificate /etc/letsencrypt/live/morningstar-ef.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/morningstar-ef.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://res.cloudinary.com; media-src 'self' https://res.cloudinary.com; connect-src 'self' https://api.cloudinary.com https://res.cloudinary.com; worker-src 'self' blob:; frame-src https://www.youtube-nocookie.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; upgrade-insecure-requests" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5005/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The Node app trusts exactly one proxy. Replace client-supplied chains
        # so request IPs used by rate limiting cannot be spoofed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    location = /api {
        return 308 /api/;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
